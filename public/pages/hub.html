    <script src="../js/sessao.js"></script>
    <script src="../js/buscarXp.js"></script>

</head>

<body onload="validarSessao(), buscarAtributos(), buscarIdAvatar(), buscarProgressoArvore()">

    <div class="header">
        <img class="logo" src="../assets/img/icon/logo2.png">

        <div class="container-btn">
            <ul>
                <li class="agora"><a href="hub.html"><span>ᚻ</span><span class="material-symbols-outlined icon-btn">
                            explore
                        </span>HUB</a></li>
                <li class="link-hub"><a href="hubQuiz.html"><span class="runa">ᚠ</span><span
                            class="material-symbols-outlined icon-btn">
                            auto_stories
                        </span>QUIZ</a></li>
                <li class="link-hub"><a href="arvore.html"><span class="runa">ᛒ</span><span
                            class="material-symbols-outlined icon-btn">
                            family_history
                        </span>ÁRVORE YGGDRASIL</a></li>
                <li class="link-hub"><a href="dashboard.html"><span class="runa">ᛋ</span><span
                            class="material-symbols-outlined icon-btn">
                            bar_chart_4_bars
                        </span>DASHBOARD</a></li>
            </ul>
        </div>
        <div class="container-perfil">
            <div class="icon-usuario">

    </div>

    <div class="container">
        <div class="container-xp"><img src="../assets/img/icon/iconXp.png">
            <span id="qtdXp"></span>
        </div>
        <a href="arsenal.html">
            <div class="posicao-container-avatar">
                <div class="container-avatar">
                    <div class="sombra"></div>
                    <img src="../assets/img/icon/logoDourado.png" class="logo-background">
                    <img src="../assets/img/avatar/kratos_avatar.png" class="kratos-avatar">
                    <img src="../assets/img/avatar/manopla_steinbjorn.png" class="manopla" id="manopla8">
                    <img src="../assets/img/avatar/manopla_zeus.png" class="manopla" id="manopla6">
                    <img src="../assets/img/avatar/manopla_esplendor.png" class="manopla" id="manopla4">
                    <img src="../assets/img/avatar/manopla_couro.png" class="manopla" id="manopla2">
                    <img src="../assets/img/avatar/armadura_steinbjorn.png" class="armadura" id="armadura7">
                    <img src="../assets/img/avatar/armadura_base.png" class="armadura" id="armadura1">
                    <img src="../assets/img/avatar/armadura_zeus.png" class="armadura" id="armadura5">
                    <img src="../assets/img/avatar/armadura_esplendor.png" class="armadura" id="armadura3">
                    <div class="container-arma">
                        <img class="arma-conjunto" src="../assets/img/cards/leviata_card.png" id="arma9">
                        <img class="arma-conjunto" src="../assets/img/cards/draupnir_card.png" id="arma10">
                        <img class="arma-conjunto" src="../assets/img/cards/laminas_card.png" id="arma11">
                    </div>
                </div>
            </div>
        </a>
        <div class="painel">
            <div class="progresso-yggdrasil">
                <a href="arvore.html">
                    <h1>Yggdrasil a Árvore do Mundo <span>Guia de equipamentos</span></h1>
                    <img src="../assets/img/cards/yggdrasil_simbolo.png" class="yggdrasil-simbolo">
                    <img src="../assets/img/cards/yggdrasil_circulo.png" class="yggdrasil-circulo">
                    <div class="container-progresso">
                        <div class="container-linha">
                            <p class="porcentagem-yggdrasil" id="porcentagemYggdrasil">XX%</p>
                            <div class="linha-progresso">
                                <div class="progresso" id="progresso"></div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
            <hr class="divisoria">
            <div class="container-status-avatar">
                <div class="container-barras">
                    <img src="../assets/img/icon/iconKratos.png" class="icon-kratos">
                    <h3>Kratos</h3>
                    <div class="status">
                        <img src="../assets/img/icon/iconVida.png" class="icon-atributo">
                        <div class="container-barra-atributo">
                            <p>Vitalidade</p>
                            <div class="barra">
                                <div class="progresso-barra" id="barraVitalidade"></div>
                            </div>
                        </div>
                        <p class="num-progresso" id="numProgressoVitalidade">XX</p>
                    </div>
                    <div class="status">
                        <img src="../assets/img/icon/iconForca.png" class="icon-atributo">
                        <div class="container-barra-atributo">
                            <p>Força</p>
                            <div class="barra">
                                <div class="progresso-barra" id="barraForca"></div>
                            </div>
                        </div>
                        <p class="num-progresso" id="numProgressoForca">XX</p>
                    </div>
                    <div class="status">
                        <img src="../assets/img/icon/iconDefesa.png" class="icon-atributo">
                        <div class="container-barra-atributo">
                            <p>Defesa</p>
                            <div class="barra">
                                <div class="progresso-barra" id="barraDefesa"></div>
                            </div>
                        </div>
                        <p class="num-progresso" id="numProgressoDefesa">XX</p>
                    </div>
                    <div class="status">
                        <img src="../assets/img/icon/iconVelocidade.png" class="icon-atributo">
                        <div class="container-barra-atributo">
                            <p>Velocidade</p>
                            <div class="barra">
                                <div class="progresso-barra" id="barraVelocidade"></div>
                            </div>
                        </div>
                        <p class="num-progresso" id="numProgressoVelocidade">XX</p>
                    </div>
                    <a href="arsenal.html"><button class="teste">Ir para o Arsenal</button></a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    let idUsuario = sessionStorage.ID_USUARIO;

    function buscarIdAvatar() {
        fetch(`/usuarios/buscarIdAvatar/${idUsuario}`, {
            method: "GET",
        })
            .then(function (resultadoBuscaIdAvatar) {
                return resultadoBuscaIdAvatar.json();
            })
            .then(function (dadosIdAvatar) {
                if (dadosIdAvatar.length > 0) {
                    sessionStorage.ID_AVATAR = dadosIdAvatar[0].idAvatar;
                    idAvatar = dadosIdAvatar[0].idAvatar;
                    buscarSetAtual();
                    buscarXp();
                } else {
                    console.log("Houve erro ao buscar o id do avatar!");
                }
            })
            .catch(function (err) {
                console.log(err);
            })
    }

    function buscarAtributos() {

        fetch(`/obterDados/BuscarDadosAtributos/${idUsuario}`, {
            method: "GET",
        })
            .then(function (resultadoBuscaAtributos) {
                return resultadoBuscaAtributos.json();
            })
            .then(function (dadosAtributos) {
                barraForca.style.width = `${dadosAtributos[0].statusForca}%`;
                numProgressoForca.innerHTML = dadosAtributos[0].statusForca;

                barraVitalidade.style.width = `${dadosAtributos[0].statusVitalidade}%`;
                numProgressoVitalidade.innerHTML = dadosAtributos[0].statusVitalidade;

                barraDefesa.style.width = `${dadosAtributos[0].statusDefesa}%`;
                numProgressoDefesa.innerHTML = dadosAtributos[0].statusDefesa;

                barraVelocidade.style.width = `${dadosAtributos[0].statusVelocidade}%`;
                numProgressoVelocidade.innerHTML = dadosAtributos[0].statusVelocidade;
            })
            .catch(function (err) {
                console.log(err);
            })

    }

    function buscarProgressoArvore() {

        fetch(`/obterDados/BuscarDadosProgressoArvore/${idUsuario}`, {
            method: "GET",
        })
            .then(function (resultadoBuscaProgressoArvore) {
                return resultadoBuscaProgressoArvore.json();
            })
            .then(function (dadosProgressoArvore) {
                let porcentagem = ((dadosProgressoArvore[0].equipamentosArsenal / 11) * 100).toFixed(1);
                progresso.style.width = `${porcentagem}%`;
                porcentagemYggdrasil.innerHTML = `${porcentagem}%`;
            })
            .catch(function (err) {
                console.log(err);
            })

    }

    function buscarSetAtual() {

        fetch(`/obterDados/BuscarDadosSetAtual/${idAvatar}`, {
            method: "GET",
        })
            .then(function (resultadoBuscaSetAtual) {
                return resultadoBuscaSetAtual.json();
            })
            .then(function (dadosSetAtual) {
                let armadura = dadosSetAtual[0].armadura;
                let manoplas = dadosSetAtual[0].manoplas;
                let arma = dadosSetAtual[0].arma;
                
                document.getElementById(armadura.toLowerCase()).style.display = "flex";
                document.getElementById(manoplas.toLowerCase()).style.display = "flex";
                document.getElementById(arma.toLowerCase()).style.display = "flex";
            })
            .catch(function (err) {
                console.log(err);
            })

    }

</script>
